; ClawdBuddy firmware: one board, the Waveshare ESP32-S3-Touch-LCD-4, plus a
; desktop simulator of it. `native` is the host unit-test env
; (`pio test -d firmware -e native`) and has no main() to link.
[platformio]
default_envs =
    waveshare_lcd_4
    sim


[env:waveshare_lcd_4]
; Waveshare ESP32-S3-Touch-LCD-4 — 480x480 ST7701 RGB parallel + GT911 touch.
; First RGB-panel port. IO expander (CH32V003 at 0x24 on V4.0, TCA9554 at
; 0x20 earlier) must init before gfx->begin() or the panel stays dark.
; Bounce buffers avoid DMA tearing against the PSRAM framebuffer. Module is
; ESP32-S3R8: 16 MB flash + 8 MB octal PSRAM, hence qio_opi and the 16 MB
; partition layout.
; No AXP2101 / IMU; KEY/PWR is hardware RST. Single BOOT button (GPIO 0).
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.38-1/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino
board_build.arduino.memory_type = qio_opi
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.partitions = default_16MB.csv
upload_speed = 921600
monitor_speed = 115200

build_src_filter =
    +<*>
    ; the ASCII pets stand in for the three Clawd actors the director drives
    ; (src/pet/pet_mascot, pet_performer, pet_face)
    -<mascot.cpp>
    -<performer.cpp>
    -<face.cpp>
    -<boards/>
    +<boards/waveshare_lcd_4/>

build_flags =
    ; the pets and the agent team view (src/pet/)
    -DPET_ASCII
    ; env name reported by the `info` serial command (build_info.h)
    -DCLAWD_ENV=\"${this.__env__}\"
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DBOARD_HAS_PSRAM
    ; rgb_resync.cpp needs the panel handle Arduino_GFX keeps private
    -Wl,--wrap=esp_lcd_new_rgb_panel
    ; NimBLE config — peripheral, 2 simultaneous connections so the OS can
    ; hold the HID link (Space key from BOOT button) while the app holds
    ; its own connection for the custom data service.
    -DCONFIG_BT_NIMBLE_ROLE_BROADCASTER=1
    -DCONFIG_BT_NIMBLE_ROLE_PERIPHERAL=1
    -DCONFIG_BT_NIMBLE_ROLE_CENTRAL=0
    -DCONFIG_BT_NIMBLE_ROLE_OBSERVER=0
    -DCONFIG_BT_NIMBLE_MAX_CONNECTIONS=2
    -DMYNEWT_VAL_BLE_STORE_MAX_CCCDS=16
    ; LVGL config via build flags
    -DLV_CONF_SKIP
    -DLV_COLOR_DEPTH=16
    -DLV_USE_LOG=0
    -DLV_USE_BAR=1
    -DLV_USE_LABEL=1
    -DLV_USE_ARC=1
    -DLV_USE_BTN=1
    -DLV_USE_LINE=1
    -DLV_USE_OBJ=1
    -DLV_USE_IMG=1
    -DLV_USE_IMAGE=1
    -DLV_USE_ANIMIMG=0
    -DLV_TICK_CUSTOM=1
    ; Refresh + animation timer period (LVGL default 33 ms = 30 fps cap).
    ; See docs/pets.md "Frame rate" before changing per board.
    -DLV_DEF_REFR_PERIOD=16
    -DLV_USE_SNAPSHOT=1

lib_deps =
    moononournation/GFX Library for Arduino@^1.6.4
    lewisxhe/SensorLib@^0.5.1
    lvgl/lvgl@^9.2.0
    bblanchon/ArduinoJson@^7.0.0
    h2zero/NimBLE-Arduino@^2.1.1


[env:sim]
; Native desktop simulator — an SDL2 window instead of a panel, mouse as
; touch, keyboard as buttons, JSONL scenario playback instead of BLE. See
; boards/sim/board.h for the key map and scenario format.
; Requires SDL2 dev headers (sdl2-config on PATH): apt install libsdl2-dev.
platform = native

build_src_filter =
    +<*>
    ; the ASCII pets stand in for the three Clawd actors the director drives
    ; (src/pet/pet_mascot, pet_performer, pet_face)
    -<mascot.cpp>
    -<performer.cpp>
    -<face.cpp>
    -<boards/>
    +<boards/sim/>
    ; transport + audio are hardware-only: boards/sim/ble_sim.cpp stubs
    ; ble.h with scenario playback, and the sim's sound HAL no-ops.
    -<ble.cpp>
    -<chime.cpp>
    -<es8311.c>

build_flags =
    ; the pets and the agent team view (src/pet/)
    -DPET_ASCII
    ; env name reported by the `info` serial command (build_info.h)
    -DCLAWD_ENV=\"${this.__env__}\"
    ; macOS: `g++` is Apple clang, which defaults to C++98 without an explicit
    ; -std and fails on constexpr / brace-init. Linux g++ (real GCC) defaults
    ; to gnu++17, which is why this only bites on macOS.
    -std=gnu++17
    ; behave like the PSRAM-equipped S3 targets (big LVGL strips, full
    ; splash canvas, screenshot path compiled) — the heap shim maps every
    ; capability to plain malloc anyway
    -DBOARD_HAS_PSRAM
    -Isrc/boards/sim/shim
    -lm
    !sdl2-config --cflags --libs
    ; LVGL config — identical to the hardware envs
    -DLV_CONF_SKIP
    -DLV_COLOR_DEPTH=16
    -DLV_USE_LOG=0
    -DLV_USE_BAR=1
    -DLV_USE_LABEL=1
    -DLV_USE_ARC=1
    -DLV_USE_BTN=1
    -DLV_USE_LINE=1
    -DLV_USE_OBJ=1
    -DLV_USE_IMG=1
    -DLV_USE_IMAGE=1
    -DLV_USE_ANIMIMG=0
    -DLV_TICK_CUSTOM=1
    ; Refresh + animation timer period (LVGL default 33 ms = 30 fps cap).
    ; See docs/pets.md "Frame rate" before changing per board.
    -DLV_DEF_REFR_PERIOD=16
    -DLV_USE_SNAPSHOT=1

lib_deps =
    lvgl/lvgl@^9.2.0
    bblanchon/ArduinoJson@^7.0.0


[env:native]
; Host unit tests for the pure firmware logic: usage-rate math, signal/event
; dedupe, payload parsing, splash geometry, the director's policy rules, the
; face's motion curves, the meters layout on every panel shape (test_layout,
; with the real fonts), and the director itself against timed stand-ins for
; its actors (test_director: the one-Clawd rule under fuzzed input).
; No hardware, no SDL, no LVGL:
;   pio test -d firmware -e native
; Only the Arduino-free sources are compiled in (build_src_filter); the
; millis() wrappers live in usage_rate_clock.cpp and stay out. Not meant for
; `pio run` — it has no main() outside the test runner.
platform = native
test_framework = unity
test_build_src = yes
build_src_filter =
    -<*>
    +<usage_rate.cpp>
    +<signals.cpp>
    +<payload.cpp>
    +<clawd_policy.cpp>
    +<face_motion.cpp>
    +<pair_hold.cpp>
    +<ding.cpp>
    +<buzzer.cpp>
    +<pace.cpp>
    +<button_action.cpp>
    +<theme_palette.cpp>
    +<clawd_anim.cpp>
    +<pet/pet_stats_core.cpp>
    +<pet/team_core.cpp>
    +<totals.cpp>
build_flags =
    -std=gnu++17
    -Isrc
    ; host stand-ins for <Arduino.h> / <lvgl.h>, used only by test_director
    -Itest/fakes
lib_deps =
    bblanchon/ArduinoJson@^7.0.0
